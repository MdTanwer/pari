[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pari-cli"
version = "0.1.2"
description = "A resilient, sandbox-first terminal coding agent engineered for high pass rates and low token burn."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PARI Contributors" }
]
keywords = ["ai", "coding-agent", "terminal", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://pari-cli.in"
Documentation = "https://pari-cli.in"
Repository = "https://github.com/MdTanwer/pari"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
ast = [
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0",
    "networkx>=3.0",
    "grep-ast>=0.3.0",
]
cloud = [
    "e2b>=0.14.0",
]
all = [
    "pari[dev,ast,cloud]",
]

[project.scripts]
pari = "pari.cli:main"
pari-cli = "pari.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pari*"]
