[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pari-cli"
version = "0.1.4"
description = "A resilient, sandbox-first terminal coding agent engineered for high pass rates and low token burn."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PARI Contributors" }
]
keywords = ["ai", "coding-agent", "terminal", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://pari-cli.in"
Documentation = "https://pari-cli.in"
Repository = "https://github.com/MdTanwer/pari"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.12.10",
    "pre-commit>=4.3.0",
    "pycodestyle>=2.12.0",
]
ast = [
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0",
    "networkx>=3.0",
    "grep-ast>=0.3.0",
]
cloud = [
    "e2b>=0.14.0",
]
all = [
    "pari-cli[dev,ast,cloud]",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.12.10",
    "pre-commit>=4.3.0",
    "pycodestyle>=2.12.0",
]

[project.scripts]
pari-cli = "pari.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pari*"]

# Matches the software-agent-sdk bar: Ruff 88 columns, isort, and function tests.
[tool.ruff]
target-version = "py311"
line-length = 88
force-exclude = true
extend-exclude = ["claude-code", "website", "resource"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "ARG",
]
extend-select = ["B006", "B008", "B039", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["pari"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
asyncio_mode = "auto"
